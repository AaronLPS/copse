<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="copse-mark">
  <title id="copse-mark">copse</title>
  <!-- A coppice stool: three stems of equal height rising from one root.
       The centre stem and the taproot are one unbroken path - the main
       worktree owns .git - and the two outer stems branch onto it. -->
  <g fill="#4A8258" stroke="#4A8258" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path fill="none" d="M16 12 V33 L32 40"/>
    <path fill="none" d="M48 12 V33 L32 40"/>
    <path stroke="none" d="M28 12 A4 4 0 0 1 36 12 L36 46 Q36 51 32 56 Q28 51 28 46 Z"/>
  </g>
</svg>
