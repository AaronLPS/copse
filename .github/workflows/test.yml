name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest only, deliberately: the test script (npm test -> node
    # --test test/*.mjs) relies on shell glob expansion, which cmd.exe/
    # PowerShell on windows-latest do not do the same way, and the
    # integration suite shells out to a real git besides. Making this
    # matrix portable to Windows is future work, not an omission.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 20 is the declared floor (engines.node >= 20). 24 is what the
        # author develops on. 22 is pinned deliberately, not just filling a
        # gap: a Node 22 regression already bit this project once, where
        # `node --test test/` (a bare directory argument) stopped expanding
        # to the files inside it. This project's own script sidesteps that
        # by globbing (test/*.mjs) rather than passing a bare directory, but
        # the regression is exactly the kind of thing this matrix exists to
        # catch again if it ever resurfaces nearby.
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # No cache: setup-node's cache option keys off a lockfile
          # (package-lock.json/npm-shrinkwrap.json/yarn.lock), and copse has
          # none — it declares zero dependencies, so there is nothing to
          # install and nothing for a cache to save.

      - name: Run the test suite
        run: npm test
